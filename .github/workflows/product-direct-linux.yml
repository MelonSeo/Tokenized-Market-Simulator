name: Linux owner-direct integration gate
on:
  push:
    branches: [melon-init, feat/c-owner-direct-integration]
permissions:
  contents: read
concurrency:
  group: linux-owner-direct
  cancel-in-progress: false
jobs:
  read-gate:
    if: github.repository == 'MelonSeo/Tokenized-Market-Simulator' && (github.ref == 'refs/heads/melon-init' || github.ref == 'refs/heads/feat/c-owner-direct-integration')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.10+7.0.LTS'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
      - name: Prepare and inspect Korean system fonts
        shell: bash
        run: |
          set -euo pipefail
          echo 'Korean font families before installation:'
          fc-list :lang=ko family | sort -u
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          dpkg-query -W -f='${Package} ${Version}\n' fonts-noto-cjk
          echo 'Korean font families after installation:'
          fc-list :lang=ko family | sort -u
          fc-list :lang=ko family | grep 'Noto Sans CJK'
          fc-match -f '%{family}\n' 'sans-serif:lang=ko'
      - name: Validate scope and pure tests
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 207f60313e507fff6f098f4843db599d0a8b8101 HEAD
          python3 --version
          java -version
          google-chrome --version
          python3 -B -m unittest discover -s deployment -p 'test_product_read_*.py'
          python3 -B -m unittest discover -s deployment -p 'test_product_direct_*.py'
      - name: Build web and selected JVM regression
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix tools/websocket-test-client
          npm test --prefix tools/websocket-test-client
          npm run build --prefix tools/websocket-test-client
          bash backend/gradlew -p backend -I "$PWD/deployment/product-read-ci.gradle" -I "$PWD/deployment/product-direct-ci.gradle" --no-daemon --max-workers=1 productReadCiClasses productReadCiRuntime productDirectCiClasses test --tests '*CCustodyControllerTest' --tests '*CCustodyRpcReaderTest' --tests '*CCustodyIdentityTest' --tests '*CWalletLinkStoreTest' --tests '*CWalletProofServiceTest' --tests '*StaticWebSecurityTest' --tests 'com.pricetrack.exchange.custody.direct.*Test'
      - name: Fetch locked Solidity dependencies and images
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v5.1.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git contracts/lib/openzeppelin-contracts
          test "$(git -C contracts/lib/openzeppelin-contracts rev-parse HEAD)" = 69c8def5f222ff96f2b5beff05dfba996368aa79
          git clone --depth 1 --branch v1.16.2 https://github.com/foundry-rs/forge-std.git contracts/lib/forge-std
          test "$(git -C contracts/lib/forge-std rev-parse HEAD)" = bf647bd6046f2f7da30d0c2bf435e5c76a780c1b
          python3 -c 'import json,subprocess; j=json.load(open("deployment/product-read-ci-lock.json")); [subprocess.run(["docker","pull",v],check=True,timeout=180) for v in j["images"].values()]'
      - name: Compile fixed Solidity sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p contracts/out contracts/cache
          image=$(python3 -c 'import json;print(json.load(open("deployment/product-read-ci-lock.json"))["images"]["anvil"])')
          docker run --rm --user "$(id -u):$(id -g)" --label tms.product.read.build=true --env HOME=/tmp --mount "type=bind,source=$PWD/contracts,target=/contracts,readonly" --mount "type=bind,source=$PWD/contracts/out,target=/out" --mount "type=bind,source=$PWD/contracts/cache,target=/cache" --entrypoint /usr/local/bin/forge "$image" build --root /contracts --out /out --cache-path /cache --skip test --skip script -j 1
      - name: Prepare and run exactly once
        shell: bash
        run: |
          set -euo pipefail
          prepared=$(python3 -B deployment/product-read-linux.py prepare)
          python3 -B deployment/product-read-linux.py run "$prepared"
      - name: Isolated owner-direct browser trades exactly once
        shell: bash
        run: |
          set -euo pipefail
          prepared=$(python3 -B deployment/product-direct-linux.py prepare)
          python3 -B deployment/product-direct-linux.py run "$prepared"
      - name: Upload only scanned allowlist
        if: always() && hashFiles('deployment/runtime/product-read-linux/public/manifest.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-read-safe-results
          path: deployment/runtime/product-read-linux/public/
          retention-days: 1
          if-no-files-found: error
      - name: Stop only recorded owned containers
        if: always()
        shell: bash
        run: python3 -B deployment/product-read-linux.py cleanup

      - name: Upload isolated direct safe results
        if: always() && hashFiles('deployment/runtime/product-direct-linux/public/manifest.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-direct-safe-results
          path: deployment/runtime/product-direct-linux/public/
          retention-days: 1
          if-no-files-found: error
      - name: Stop only isolated direct owned resources
        if: always()
        shell: bash
        run: python3 -B deployment/product-direct-linux.py cleanup
