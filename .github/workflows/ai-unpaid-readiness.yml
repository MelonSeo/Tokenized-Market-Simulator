name: AI unpaid readiness gate
on:
  push:
    branches: [main, ci/ai-unpaid-readiness-20261031]
permissions:
  contents: read
concurrency:
  group: ai-unpaid-readiness
  cancel-in-progress: false
jobs:
  unpaid:
    if: github.repository == 'MelonSeo/Tokenized-Market-Simulator' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci/ai-unpaid-readiness-20261031')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ''
      AI_API_KEY: ''
      AI_ENABLED: 'false'
      AI_AUTO_DIAGNOSIS_ENABLED: 'false'
      BLOCKCHAIN_ENABLED: 'false'
      AI_PILOT_BROWSER: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21.0.10+7.0.LTS'
      - name: Guard and frozen data audit
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          java -version
          python3 deployment/ai-readiness.py guard
          python3 deployment/ai_novel_question_audit.py
          python3 -B -m unittest discover -s deployment -p test_ai_readiness.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - name: Build existing web and Korean Chrome environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          google-chrome --version
          npm ci --ignore-scripts --prefix tools/websocket-test-client
          npm test --prefix tools/websocket-test-client
          npm run build --prefix tools/websocket-test-client
      - name: Unpaid AI, auth and settlement regression
        shell: bash
        run: |
          set -euo pipefail
          bash backend/gradlew -p backend test --no-daemon --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx384m -XX:MaxMetaspaceSize=256m' --tests 'com.pricetrack.exchange.ai.*' --tests '*LatestAiNovelHarnessTest' --tests '*OnchainSettlementServiceTest' --tests '*JwtTokenProviderTest' --tests '*AuthServiceTest' --tests '*AuthIntegrationTest' --tests '*StaticWebSecurityTest'
          python3 -B -m unittest discover -s deployment -p 'test_ai*.py'
      - name: Cached locked database image
        shell: bash
        run: |
          set -euo pipefail
          image=$(python3 -c 'import json;print(json.load(open("deployment/ai-readiness-plan.json"))["image"])')
          docker pull "$image"
      - name: Real HTTP and PostgreSQL with controlled providers
        shell: bash
        run: python3 -B deployment/ai-readiness.py run
      - name: Validate numeric-only public evidence
        id: public_evidence
        if: always() && hashFiles('deployment/runtime/ai-readiness-*/public/manifest.json') != ''
        run: python3 deployment/ai-readiness.py verify-public
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.public_evidence.outcome == 'success'
        with:
          name: ai-unpaid-readiness
          path: |
            deployment/runtime/ai-readiness-*/public/
            deployment/runtime/ai-readiness-*/public-web/
          if-no-files-found: error
          retention-days: 3
