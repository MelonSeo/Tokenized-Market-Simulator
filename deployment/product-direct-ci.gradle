// Additional trial actors only. Keep the existing read build/tasks unchanged.
allprojects {
    afterEvaluate { p ->
        if (p.plugins.hasPlugin('java')) {
            tasks.register('productDirectCiClasses', JavaCompile) {
                dependsOn tasks.named('productReadCiClasses')
                source ['ProductDirectFixture', 'ProductDirectDriver', 'ProductDirectGate', 'CDirectOracleServer'].collect { rootProject.file('../deployment/' + it + '.java') }
                classpath = sourceSets.main.runtimeClasspath + files(layout.buildDirectory.dir('product-read-ci/helpers'))
                destinationDirectory = layout.buildDirectory.dir('product-read-ci/helpers')
                javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
                options.release = 21
                options.encoding = 'UTF-8'
                options.compilerArgs += ['-parameters', '-proc:none']
            }
        }
    }
}
